<div class="user-cards">
    <div class="user-card-item-content">
        <p>{{ user.name }}<p>
        <p>{{ user.email }}</p>
        <p>{{ user.website }}</p>
        <p>{{ user.company.name }}</p>
    </div>

    <div>
        <button type="button" class="delete" (click)="openDeleteDialog()">Удалить</button>
        <button type="button" class="create" (click)="openEditDialog()">Редактировать</button>
    </div>
</div>
